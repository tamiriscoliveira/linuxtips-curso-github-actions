name: Teste de ID

on: workflow_dispatch

jobs:
  build: # JOB ID = build
    runs-on: ubuntu-latest
    steps:
      - name: Testes de cobertura
        id: test-cobertura #STEP ID = test-cobertura
        run: echo "porcentagem=12" >> "$GITHUB_OUTPUT"
    outputs: 
      test-cobertura: ${{ steps.test-cobertura.outputs.porcentagem }}


  quality-gate: # JOB ID = quality-gate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Quality Gate Tests
        env:
          COBERTURA: ${{ needs.build.outputs.test-cobertura }}
          COBERTURA_MINIMA: '80'
        run: |
          set -euo pipefail
          if [[ -z "${COBERTURA}" ]]; then
            echo "::error::O job 'build' não publicou a cobertura (output vazio)"
            exit 1
          fi
          if ! [[ "${COBERTURA}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "::error::Cobertura inválida recebida do job 'build': '${COBERTURA}'"
            exit 1
          fi
          echo "Cobertura mínima: ${COBERTURA_MINIMA}%"
          echo "Cobertura obtida: ${COBERTURA}%"
          if ! awk -v obtida="${COBERTURA}" -v minima="${COBERTURA_MINIMA}" 'BEGIN { exit !(obtida + 0 >= minima + 0) }'; then
            echo "::error::Build reprovado por baixa cobertura"
            exit 1
          fi
