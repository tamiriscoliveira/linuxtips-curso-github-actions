name: Pipeline Completo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino
        required: true
        default: staging
        type: choice
        options: [staging, production]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        working-directory: app
        run: npm ci

      - name: Lint NPM
        id: lint
        working-directory: app
        run: npm run lint

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        id: deps
        working-directory: app
        run: npm ci

      - name: Run unit tests
        id: test
        working-directory: app
        run: |
          set -euo pipefail
          npm test
          if [[ ! -f report.json ]]; then
            echo "::error::report.json não foi gerado pelos testes; não é possível apurar a cobertura"
            exit 1
          fi
          coverage=$(jq -e -r '.total.lines.pct' report.json)
          if [[ -z "$coverage" || "$coverage" == "null" ]]; then
            echo "::error::Não foi possível ler '.total.lines.pct' de report.json"
            exit 1
          fi
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"
      - name: Quality gate de cobertura
        env:
          COVERAGE: ${{ steps.test.outputs.coverage }}
          COBERTURA_MINIMA: '80'
        run: |
          set -euo pipefail
          echo "Cobertura obtida: ${COVERAGE}% (mínimo: ${COBERTURA_MINIMA}%)"
          if ! awk -v obtida="$COVERAGE" -v minima="$COBERTURA_MINIMA" 'BEGIN { exit !(obtida + 0 >= minima + 0) }'; then
            echo "::error::Cobertura de ${COVERAGE}% abaixo do mínimo de ${COBERTURA_MINIMA}%"
            exit 1
          fi
    outputs:
      coverage: ${{ steps.test.outputs.coverage }}

  docker:
    permissions:
      contents: read
      packages: write
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Build
        id: docker_login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: build_push
        run: |
          set -euo pipefail
          repo_lc=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo_lc}/api:${GITHUB_SHA}"
          docker build \
            --build-arg GH_PACKAGES_TOKEN \
            -t "$image" \
            app
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
    outputs:
      image: ${{ steps.build_push.outputs.image }}

  deploy:
    needs: docker
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Print image
        run: echo "Deploying ${{ needs.docker.outputs.image }} to ${{ inputs.environment }}"