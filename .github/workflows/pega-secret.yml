name: Expõe Secret

on:
  workflow_dispatch:

jobs:
    show-secret:
        runs-on: ubuntu-latest
        steps: 
            - name: Tentativa de expor uma secret
              run: echo "${{secrets.CURSO_ACTIONS_SECRET }}"

            
            - name: Tentativa de expor uma secret manipulada
              run: echo "${{secrets.CURSO_ACTIONS_SECRET }}" | sed 's/ ./&  /g'   