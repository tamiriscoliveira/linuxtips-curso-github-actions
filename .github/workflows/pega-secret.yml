name: Expõe Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
    show-secret:
        runs-on: ubuntu-latest
        steps:
            # A secret e passada por env e o valor aparece mascarado (***) no log.
            # Nao manipule a saida (sed/base64/cut) para burlar o mascaramento:
            # isso vaza o valor real no log, que fica visivel para qualquer pessoa
            # com acesso de leitura ao repositorio.
            - name: Tentativa de expor uma secret
              env:
                CURSO_ACTIONS_SECRET: ${{ secrets.CURSO_ACTIONS_SECRET }}
              run: echo "$CURSO_ACTIONS_SECRET"