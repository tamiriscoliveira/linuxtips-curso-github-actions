name: Validação de Ambiente

on:
  workflow_dispatch:

jobs:
  valida-ambiente-prd:
    if: github.ref_name == 'main'
    uses: ./.github/workflows/shared-validate-environment.yml
    with:
      environment: production
      day-of-week: sabado
      day-of-month: "10"

  valida-ambiente-stg:
    if: github.ref_name == 'staging'
    uses: ./.github/workflows/shared-validate-environment.yml
    with:
      environment: staging
      day-of-week: sexta
      day-of-month: "20"
