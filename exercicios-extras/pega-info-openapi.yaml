name: Pega informação openapi

on:
  workflow_dispatch:

jobs:
  job-teste:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Read OpenAPI metadata
        id: openapi
        uses: ./.github/actions/read-openapi-metadata
        with:
          openapi-file: openapi.yaml
          repository-field: .info.x-repository-name

      - name: Mostrar valores
        run: |
          echo "Repo: ${{ steps.openapi.outputs.repository }}"
          echo "Title: ${{ steps.openapi.outputs.title }}"
          echo "Version: ${{ steps.openapi.outputs.version }}"
