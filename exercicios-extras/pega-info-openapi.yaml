name: Pega informação openapi

on:
  workflow_dispatch:

jobs:
  job-teste:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar yq
        run: |
          set -euo pipefail
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Read OpenAPI metadata
        run: |
          set -euo pipefail
          title=$(yq -e '.info.title' openapi.yaml)
          version=$(yq -e '.info.version' openapi.yaml)
          repo=$(yq -e '.info.x-repository-name' openapi.yaml)
          {
            echo "TITLE=${title}"
            echo "VERSION=${version}"
            echo "REPO=${repo}"
          } >> "$GITHUB_ENV"

      - name: Mostrar valores
        run: |
          echo "Repo: $REPO"
          echo "Title: $TITLE"
          echo "Version: $VERSION"
